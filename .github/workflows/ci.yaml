#section 3
name: needs-Git-action

on:
  workflow_dispatch:

jobs:
  job-1:
    runs-on: ubuntu-latest

    steps:
      - run: echo "A job consists of"
      - run: echo "One or more steps"
      - run: echo "Which runs sequentially"
      - run: echo "Within the same computer environment"

  job-2:
    runs-on: ubuntu-latest

    steps:
      - run: echo "Multiple jobs can be run in parallel"

  job-3:
    runs-on: ubuntu-latest

    needs:
      - job-1
      - job-2

    steps:
      - run: echo "They can depend on one another"

  job-4:
    runs-on: ubuntu-latest

    needs:
      - job-2
      - job-3

    steps:
      - run: echo "...A DAG"

  job-5:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.8"
          - "3.9"
        env:
          - "Prod"
          - "Stag"

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print Environment
        run: echo "Environment is ${{ matrix.env }}"

      - name: Run Python Command
        run: python -c 'print("Hello World")'
